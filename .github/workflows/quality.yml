name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reactapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reactapp/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend H2 tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: springapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The wrapper is committed without the executable bit, so CI must set it.
      # Batching keeps the log readable; any failing goal fails the job.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test
