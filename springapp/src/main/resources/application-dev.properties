# === Local development profile (activate with SPRING_PROFILES_ACTIVE=dev) ===
# Phase 16: local development is an explicit opt-in profile. The database is
# still supplied entirely by the environment (no default URL here) — point
# DB_URL at a DISPOSABLE development database, never at a populated one.
#
# This is the only non-test profile that lets Hibernate create/update the schema.
# Production (`prod`) is validate-only and tests/e2e use in-memory H2.
spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=false

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
