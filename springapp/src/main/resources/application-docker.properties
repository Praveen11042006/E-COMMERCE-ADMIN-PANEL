# === Docker Compose demo profile (local evaluation only) ===
# This is NOT a production profile. It exists so `docker compose up` can boot a
# fresh, empty MySQL container without applying migrations: Hibernate creates the
# schema once, and the existing application keeps working unchanged.
#
# Production runs with SPRING_PROFILES_ACTIVE=prod (see application-prod.properties),
# which validates the schema and never mutates it.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# Same-origin access through the bundled nginx proxy; override when the demo is
# reached through another origin.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000}

server.forward-headers-strategy=framework
logging.level.root=INFO
