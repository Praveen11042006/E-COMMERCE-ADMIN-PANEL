# === Database ===
# Phase 16: there is NO implicit database fallback. DB_URL, DB_USERNAME and
# DB_PASSWORD must be supplied explicitly by the environment, so a bare start
# can never silently connect to (and mutate) a populated local database.
# The local Docker demo supplies them in docker-compose.yml; local development
# uses the explicit `dev` profile (application-dev.properties).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Hibernate ===
# The base profile never creates or alters schema. `dev` opts into update for a
# disposable local database, `prod` validates, and tests/e2e use H2 + create.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway is enabled only by the isolated flyway-test profile.
spring.flyway.enabled=false

# === Server ===
server.port=${PORT:8080}

# === JWT ===
# NOTE: the value below is a LOCAL DEV FALLBACK ONLY. application-prod.properties
# refuses to start unless JWT_SECRET is supplied via the environment. Always set a
# unique >= 32 character secret per environment in any real deployment.
jwt.secret=${JWT_SECRET:ecomSecretKey2024PleaseChangeInProductionEnvironment!}
jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}

# === Login brute-force protection (Phase 10A, in-memory / single instance) ===
# N failed attempts within the window trigger a temporary (non-permanent) cooldown.
security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
security.login.max-failed-attempts-per-ip=${LOGIN_MAX_FAILED_ATTEMPTS_PER_IP:20}
security.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}
security.login.lockout-seconds=${LOGIN_LOCKOUT_SECONDS:900}
# Upper bound on tracked email/IP keys; stale entries are swept first and, when
# the bound is reached, new keys are not tracked (fail open) so a flood cannot
# evict the counters of already-tracked callers.
security.login.max-tracked-keys=${LOGIN_MAX_TRACKED_KEYS:10000}

# === CORS (comma-separated allowed origins) ===
# LOCAL DEVELOPMENT FALLBACK ONLY. Production requires APP_CORS_ORIGINS and
# accepts explicit HTTPS origins only.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

# === Actuator ===
# Only the health probe is exposed over HTTP. It is reachable without a JWT
# (container/orchestrator health checks) and never reveals dependency details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# === Graceful shutdown ===
# Allow in-flight requests to complete before the JVM exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# === Logging ===
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# === Reverse-proxy awareness ===
# Honour X-Forwarded-* headers set by a trusted reverse proxy (nginx, load balancer)
# so redirects/secure-cookie decisions see the original scheme and host.
server.forward-headers-strategy=framework

