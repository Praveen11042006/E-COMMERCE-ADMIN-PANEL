# === Production profile (activate with SPRING_PROFILES_ACTIVE=prod) ===
# DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, and APP_CORS_ORIGINS are all
# mandatory external values; none has a production fallback.
# Secrets MUST be supplied externally — there is intentionally NO fallback value here.
# If JWT_SECRET is missing when this profile is active, the application fails fast
# at startup during placeholder resolution instead of silently using a default.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${APP_CORS_ORIGINS}

# Production never mutates the schema: validate the existing schema against the
# entity mappings and fail fast on drift. Schema changes belong to a reviewed
# migration, never to Hibernate.
spring.jpa.hibernate.ddl-auto=validate

# Production application startup never runs migrations.
spring.flyway.enabled=false

# Health probes must not leak database/topology details to anonymous callers.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
