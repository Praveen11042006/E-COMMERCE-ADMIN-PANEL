# E2E PROFILE — used only by the Playwright suite (spring-boot:run with the test
# classpath). Isolated in-memory H2 database; the real `ecom` MySQL database is
# never contacted. This file lives in test resources and is not packaged.
spring.datasource.url=jdbc:h2:mem:e2e;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false

server.port=8080

# Deterministic, test-only signing key (never used outside the E2E profile).
jwt.secret=e2ePlaywrightSecretKeyNotForProduction0123456789
jwt.expirationMs=3600000

# The E2E suite logs in a handful of times; keep the brute-force limiter out of the way.
security.login.max-failed-attempts=50
security.login.max-failed-attempts-per-ip=100
security.login.window-seconds=900
security.login.lockout-seconds=1

# Frontend dev server origin used by Playwright.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
