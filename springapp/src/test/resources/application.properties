# TEST PROFILE: Use in-memory H2 and force correct dialect for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false

# Mirrors src/main/resources/application.properties: only the health probe is
# exposed, and the liveness/readiness groups are enabled for container checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# JWT secret for tests
jwt.secret=testSecretKeyForJUnitTestsOnlyNotForProduction!!
jwt.expirationMs=3600000

